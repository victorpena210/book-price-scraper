spring.application.name=contact-tracker

spring.datasource.url=jdbc:mysql://localhost:3306/book_price_scraper
spring.datasource.username=bookscraper_admin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

scraper.base-url=https://books.toscrape.com/
# Run the existing public-page scraper once each time the app starts.

spring.devtools.restart.enabled=false
# Melissa Personator Search
melissa.api-key=${MELISSA_API_KEY:}
scraper.run-on-startup=false
server.address=127.0.0.1
