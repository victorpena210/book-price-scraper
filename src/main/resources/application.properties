spring.application.name=contact-tracker

spring.datasource.url=jdbc:mysql://localhost:3306/book_price_scraper
spring.datasource.username=bookscraper_admin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

scraper.base-url=https://books.toscrape.com/
# Run the existing public-page scraper once each time the app starts.

spring.devtools.restart.enabled=false
# Melissa Personator Search
melissa.api-key=${MELISSA_API_KEY:}
scraper.run-on-startup=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
